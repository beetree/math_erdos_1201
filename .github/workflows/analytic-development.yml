name: MR completion development

on:
  push:
    branches: [formalize/mr-complete-20260906]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Materialize MR dependency and satisfy its standalone patch layout
        run: |
          set +e
          lake update
          first=$?
          set -e
          if [ "$first" -ne 0 ]; then
            mr=.lake/packages/lean-proofs-latest/src/latest
            mkdir -p "$mr/.lake/packages"
            for p in BoundedGaps AINTLIB leancert Waring; do
              test -d ".lake/packages/$p"
              ln -sfn "$(realpath ".lake/packages/$p")" "$mr/.lake/packages/$p"
            done
            lake update
          fi
      - name: Enumerate high-level MR short-interval endpoints
        run: |
          root=.lake/packages/lean-proofs-latest/src/latest/ErdosProblems/Erdos67b
          echo '=== theorem declarations containing shortInterval ==='
          grep -R -n -E '^theorem [A-Za-z0-9_]*[Ss]hortInterval[A-Za-z0-9_]*|^theorem [A-Za-z0-9_]*short[A-Za-z0-9_]*MeanSquare[A-Za-z0-9_]*' "$root" --include='*.lean' | tail -n 250 || true
          echo '=== centeredNormalized usages/declarations ==='
          grep -R -n 'centeredNormalizedShortAverageMeanSquare' "$root" --include='*.lean' | tail -n 150 || true
      - name: Obtain caches and build
        run: |
          lake exe cache get
          lake build
      - name: Enforced smooth-side axiom audit
        run: lake env lean Erdos1201/Smooth/Audit.lean
