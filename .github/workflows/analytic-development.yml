name: Analytic input development

on:
  push:
    branches:
      - formalize/analytic-inputs-20260906
      - formalize/mr-20260906
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package verified MV source for porting
        if: ${{ github.ref_name == 'formalize/mr-20260906' }}
        run: |
          git clone --depth 1 https://github.com/ZafirGu/zeta-23-lean.git /tmp/zeta23
          mkdir -p payload/Zeta23/MV
          cp /tmp/zeta23/Zeta23/MV.lean payload/Zeta23/
          cp /tmp/zeta23/Zeta23/Hypotheses.lean payload/Zeta23/
          cp /tmp/zeta23/Zeta23/MV/{Spacing,Quadratic,EigenIdentity,Eigen,Duality,Final}.lean payload/Zeta23/MV/
          cp /tmp/zeta23/LICENSE payload/ZETA23_LICENSE
      - uses: actions/upload-artifact@v4
        if: ${{ github.ref_name == 'formalize/mr-20260906' }}
        with:
          name: zeta23-mv-source
          path: payload
          retention-days: 1
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Obtain dependencies
        run: lake exe cache get
      - name: Test verified MV source on the pinned 4.34 toolchain
        if: ${{ github.ref_name == 'formalize/mr-20260906' }}
        run: |
          mkdir -p Zeta23/MV
          cp /tmp/zeta23/Zeta23/MV.lean Zeta23/
          cp /tmp/zeta23/Zeta23/MV/{Spacing,Quadratic,EigenIdentity,Eigen,Duality,Final}.lean Zeta23/MV/
          sed -i 's#import Zeta23.LinAlg.HermitianPosPart#import Mathlib.Analysis.Matrix.Spectrum#' Zeta23/MV/Duality.lean
          cat > Zeta23/Hypotheses.lean <<'EOF'
          import Mathlib
          noncomputable section
          open Finset Complex
          open scoped BigOperators ComplexConjugate
          namespace Zeta23
          def MVHilbert (C : ℝ) : Prop :=
            ∀ (ι : Type) [Fintype ι] [DecidableEq ι] (freq δ : ι → ℝ) (x z : ι → ℂ),
              Function.Injective freq → (∀ r, 0 < δ r) →
              (∀ r s, r ≠ s → δ r ≤ |freq r - freq s|) →
              ‖∑ r, ∑ s, if r = s then (0 : ℂ) else
                  x r * conj (z s) / ((freq r - freq s : ℝ) : ℂ)‖
                ≤ C * Real.sqrt (∑ r, ‖x r‖ ^ 2 / δ r) *
                    Real.sqrt (∑ r, ‖z r‖ ^ 2 / δ r)
          end Zeta23
          EOF
          cat >> lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "Zeta23"
          EOF
          lake build Zeta23
          lake env lean Zeta23/MV/Final.lean
      - name: Build the full project
        run: lake build Erdos1201
      - name: Enforced smooth-side axiom audit
        run: lake env lean Erdos1201/Smooth/Audit.lean
