name: MR completion development

on:
  push:
    branches: [formalize/mr-complete-20260906]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Refresh pinned dependency manifest
        run: lake update
      - name: Obtain caches and build
        run: |
          lake exe cache get
          lake build
      - name: Enforced smooth-side axiom audit
        run: lake env lean Erdos1201/Smooth/Audit.lean
